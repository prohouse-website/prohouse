name: Utility bill calculator tests
on:
  pull_request:
    paths:
      - 'public/assets/bill-math.js'
      - 'public/assets/bill-calculator.js'
      - 'src/utilities-pdf.js'
      - 'src/utility-extraction.js'
      - 'test/utility-improvements.test.mjs'
      - 'src/worker.js'
      - 'test/utility-split.test.mjs'
      - 'test/utilities-pdf.test.mjs'
      - '.github/workflows/utility-calculator.yml'
  workflow_dispatch:
jobs:
  test-utility-bills:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Check source syntax
        run: |
          node --check public/assets/bill-math.js
          node --check public/assets/bill-calculator.js
          node --check src/utilities-pdf.js
          node --check src/utility-extraction.js
          node --check src/worker.js
      - name: Test allocation and downloadable PDF
        run: node --test test/utility-split.test.mjs test/utilities-pdf.test.mjs test/utility-improvements.test.mjs
