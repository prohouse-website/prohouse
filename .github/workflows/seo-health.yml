name: SEO health
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '15 21 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public page SEO
        run: node scripts/check-seo.mjs
      - name: Check production URLs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/check-seo.mjs --live
