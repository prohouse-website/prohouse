<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Guest messages | ProHouse</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f1;color:#19251e;font:16px/1.5 "DM Sans",Arial,sans-serif}main{max-width:980px;margin:auto;padding:32px 20px}a{color:inherit}h1{font-size:clamp(32px,6vw,58px);letter-spacing:-.05em;margin:18px 0}h2{margin-top:0;font-size:21px}section,aside{background:white;border:1px solid #d6ddd4;border-radius:16px;padding:20px}button,input,textarea{font:inherit}button{background:#253d30;color:white;border:none;border-radius:8px;padding:10px 15px;cursor:pointer}button:disabled{opacity:.5;cursor:default}textarea,input{width:100%;padding:11px;border:1px solid #aebbb1;border-radius:8px;margin:5px 0 12px}textarea{resize:vertical}label{display:block;font-weight:600}.grid{display:grid;grid-template-columns:minmax(210px,1fr) 2fr;gap:16px}.tools{display:flex;gap:8px;flex-wrap:wrap}.secondary,#threads button{background:#eff3ed;color:#213b2a}#threads button{display:block;text-align:left;width:100%;margin:7px 0}.active{outline:2px solid #44634c}#history{white-space:pre-wrap;max-height:330px;overflow:auto}#notice{min-height:1.5em}#signin{max-width:450px}[hidden]{display:none!important}@media(max-width:680px){.grid{grid-template-columns:1fr}}
</style></head><body><main><a href="/operations/">ProHouse Operations</a><h1>Guest messages</h1>
<p id="notice" role="status" aria-live="polite"></p>
<section id="signin" hidden><h2>Admin sign-in</h2><form id="login"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button> <a href="/operations/rental/">Reset password</a></form></section>
<div class="grid" id="desk" hidden><aside><h2>Hostex inbox</h2><p id="autoStatus"></p><button id="toggleAuto" class="secondary"></button><h3>Needs review</h3><div id="queue"></div><p id="connection"></p><div class="tools"><button id="refresh" class="secondary">Refresh inbox</button><button id="manual" class="secondary">Paste a message</button></div><div id="threads"></div><button id="more" class="secondary" hidden>Load more</button></aside>
<section><h2 id="title">Paste a guest message</h2><div id="history"></div><label id="promptLabel">Guest message<textarea id="prompt" rows="4" maxlength="16000"></textarea></label><button id="generate">Draft reply</button><p></p><label>Reply to review<textarea id="reply" rows="6" maxlength="8000"></textarea></label><div class="tools"><button id="send" hidden>Send through Hostex</button><button id="copy" class="secondary">Copy reply</button></div></section></div></main><script type="module" src="./inbox.js"></script></body></html>
